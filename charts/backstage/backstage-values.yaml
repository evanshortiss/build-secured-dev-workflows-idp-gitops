upstream:
  backstage:
    image:
      registry: {{ rhads_dh_quay_backstage_registry }}
      repository: {{ rhads_dh_quay_backstage_image }}
      tag: '{{ rhads_dh_quay_backstage_image_tag }}'
      pullSecrets:
      - redhat-gpte-devhub-pull-secret

    extraVolumeMounts:
      - name: dynamic-plugins-root
        mountPath: /opt/app-root/src/dynamic-plugins-root
      - name: temp
        mountPath: /tmp
      # - name: rbac-policy
      #   mountPath: opt/app-root/src/rbac
    extraVolumes:
      - name: dynamic-plugins-root
        persistentVolumeClaim:
          claimName: dynamic-plugins-root
      - name: dynamic-plugins
        configMap:
          defaultMode: 420
          name: '{{ printf "%s-dynamic-plugins" .Release.Name }}'
          optional: true
      - name: dynamic-plugins-npmrc
        secret:
          defaultMode: 420
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-npmrc" .Release.Name }}'
      - name: dynamic-plugins-registry-auth
        secret:
          defaultMode: 416
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-registry-auth" .Release.Name }}'
      - name: npmcacache
        emptyDir: {}
      - name: temp
        emptyDir: {}
      # - name: rbac-policy
      #   configMap:
      #     name: rbac-policy
      #     defaultMode: 420

    initContainers:
      - name: install-dynamic-plugins
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2.5Gi
            ephemeral-storage: 5Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: "RuntimeDefault"
        image: '{{ include "backstage.image" . }}'
        command:
          - ./install-dynamic-plugins.sh
          - /dynamic-plugins-root
        env:
          - name: NPM_CONFIG_USERCONFIG
            value: /opt/app-root/src/.npmrc.dynamic-plugins
          - name: MAX_ENTRY_SIZE
            value: "30000000"
        imagePullPolicy: Always
        volumeMounts:
          - mountPath: /dynamic-plugins-root
            name: dynamic-plugins-root
          - mountPath: /opt/app-root/src/dynamic-plugins.yaml
            name: dynamic-plugins
            readOnly: true
            subPath: dynamic-plugins.yaml
          - mountPath: /opt/app-root/src/.npmrc.dynamic-plugins
            name: dynamic-plugins-npmrc
            readOnly: true
            subPath: .npmrc
          - mountPath: /opt/app-root/src/.config/containers
            name: dynamic-plugins-registry-auth
            readOnly: true
          - mountPath: /opt/app-root/src/.npm/_cacache
            name: npmcacache
        workingDir: /opt/app-root/src
    
    extraEnvVarsSecrets:
      - backstage-env-secret
    extraEnvVars:
      - name: BACKEND_URL
        value: {{ rhads_dh_backstage_url }}
      - name: ARGOCD_URL
        value: {{ rhads_dh_argocd_url }}
      - name: AUTH_OIDC_METADATA_URL
        value: {{ rhads_dh_auth_oidc_metadata_url }}
      - name: KEYCLOAK_LOGIN_REALM
        value: {{ rhads_dh_keycloak_login_realm }}
      - name: KEYCLOAK_REALM
        value: {{ rhads_dh_keycloak_realm }}
      - name: KEYCLOAK_BASE_URL
        value: {{ rhads_dh_keycloak_base_url }}
      - name: GITLAB_HOST
        value: {{ rhads_dh_gitlab_host }}
      - name: QUAY_URL
        value: {{ rhads_dh_quay_url }}
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"

    appConfig:
      app:
        baseUrl: ${BACKEND_URL}
        title: Red Hat Developer Hub

      argocd:
        appLocatorMethods:
        - instances:
          - name: default
            url: ${ARGOCD_URL}
            username: ${ARGOCD_USER}
            password: ${ARGOCD_PASSWORD}
          type: config
        waitCycles: 25

      auth:
        environment: development
        providers:
          guest:
            dangerouslyAllowOutsideDevelopment: true
        # environment: production
        # providers:
        #   oidc:
        #     production:
        #       clientId: ${AUTH_OIDC_CLIENT_ID}
        #       clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        #       metadataUrl: ${AUTH_OIDC_METADATA_URL}
        #       prompt: auto
        #       signIn:
        #         resolvers:
        #         - resolver: preferredUsernameMatchingUserEntityName
        session:
          secret:
            $env: BACKEND_SECRET
      # signInPage: "oidc"
      backend:
        reading:
            allow:
              - host: {{rhads_dh_gitlab_host}}
        auth:
          keys:
          - secret: ${BACKEND_SECRET}
        baseUrl: ${BACKEND_URL}
        cors:
          origin: ${BACKEND_URL}
      catalog:
#         locations:
{% for target in rhads_dh_developer_hub_catalog_url %}
{% for file in target.file %}
#         - target: https://{{ rhads_dh_gitlab_host }}/{{ target.group }}/{{ target.repository }}/blob/{{ target.revision }}/{{ file }}
#           type: url
{% endfor %}
{% endfor %}
