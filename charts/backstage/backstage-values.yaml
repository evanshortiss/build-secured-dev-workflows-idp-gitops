#        gitlab:
#        - host: ${GITLAB_HOST}
#          baseUrl: https://${GITLAB_HOST}
#          apiBaseUrl: https://${GITLAB_HOST}/api/v4
#          token: ${GITLAB_TOKEN}

      permission:
        enabled: false
      proxy:
        endpoints:
          # '/quay/api':
          #   changeOrigin: true
          #   headers:
          #     Authorization: Bearer ${QUAY_API_TOKEN}
          #     X-Requested-With: XMLHttpRequest
          #   secure: true
          #   target: ${QUAY_URL}
          '/developer-hub':
            target: https://${GITLAB_HOST}/
            pathRewrite:
              '^/api/proxy/developer-hub/tech-radar': /gitops/build_secured_dev_workflows_idp_gitops/-/raw/main/config/tech-radar.json
            changeOrigin: true
            secure: false

      quay:
        uiUrl: ${QUAY_URL}
      techdocs:
        builder: local
        generator:
          runIn: local
        publisher:
          type: local

  postgresql:
    auth:
      username: bn_backstage
      postgresUser: postgres
      database: postgres
      existingSecret: backstage-postgresql
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password

route:
  enabled: true
  host: {{ rhads_dh_backstage_host }}
  tls:
    enabled: true
    termination: "edge"